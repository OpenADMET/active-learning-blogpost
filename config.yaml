data:
  # Path to the main labelled dataset (CSV or Parquet). Tilde expansion is applied.
  dataset_path: data/challenge_train.csv
  dataset_smiles_col: SMILES
  dataset_activity_col: pEC50

  # Optional external seed training dataset (CSV). Set to null to skip.
  # These compounds are always included in the training set at every AL iteration
  # and are never queried or evaluated.
  seed_data_path: data/chembl.csv
  seed_smiles_col: SMILES
  seed_activity_col: pEC50

active_learning:
  # Subset of strategies to run. Valid options:
  # EI, UCB, Random, Exploitation, Exploration, Diversity
  strategies:
    - EI
    - UCB
    - Random
    - Exploitation
    - Exploration
    - Diversity

  # Split types to run. Valid options: scaffold, random, cluster
  # Each produces a separate setup_<split_type>.pkl and run_<split_type>_*.pkl set.
  split_types:
    - scaffold
    # - random
    # - cluster

  # Outer seeds used to generate error bands on learning curves.
  # Each (strategy, seed) pair becomes one HPC job.
  seeds: [42, 43, 44, 45, 46]

  # Active learning loop parameters
  k_iter: 20       # Number of AL iterations per run
  query_size: 100  # Compounds selected from the pool per iteration
  n_start: 0       # Initial labeled pool size (set to 0 when using --seed-data)

training:
  n_models: 5      # Committee size (number of bootstrapped ensemble members)
  max_epochs: 20   # Maximum training epochs per committee member
  use_chemeleon: true  # Whether to initialise each committee member from CheMeleon pretrained weights

clustering:
  # Parameters used when split_types includes "cluster".
  # method: butina | kmeans | bemis-murcko
  method: butina
  # k_clusters: number of clusters for the kmeans method (ignored by butina/bemis-murcko)
  k_clusters: 10
  # butina_cutoff: Tanimoto distance threshold for Butina clustering (ignored by kmeans)
  butina_cutoff: 0.65
