# Oracle config for ASAP Mpro — ramping (rho 0.0→0.6, MAE 0.7→0.3)
# Strategies: EI, UCB, Random, Exploitation, Exploration (no Diversity)

data:
  dataset_path: data/asap_potency.csv
  dataset_smiles_col: CXSMILES
  dataset_activity_col: "pIC50 (SARS-CoV-2 Mpro)"
  results_path: results/oracle_asap_ramping
  dataset_split_seed: 43
  gtm_seed: 1234
  setup_results_path: results/asap_chemprop
  seed_data_path: null
  seed_smiles_col: SMILES
  seed_activity_col: pEC50
  predefined_split_col: Set

active_learning:
  strategies:
    - EI
    - UCB
    - Random
    - Exploitation
    - Exploration
  split_types:
    - predefined
  seeds: [42, 43, 44, 45, 46]
  k_iter: 7
  query_size: 100
  n_start: 100

training:
  n_models: 5
  max_epochs: 200
  es_min_delta: 0.001
  es_patience: 15
  use_chemeleon: false

clustering:
  method: butina
  k_clusters: 10
  butina_cutoff: 0.65

oracle:
  initial_mae: 0.9
  final_mae: 0.6
  initial_uncertainty_rho: 0.0
  final_uncertainty_rho: 0.8
  initial_shrinkage: 0.20
  final_shrinkage: 0.65
  noise_heteroscedasticity: 0.6
