# Oracle config for PXR — rho=0.8 (strong uncertainty correlation)
# Strategies: EI, UCB, Random, Exploitation, Exploration (no Diversity)
# MAE ramps 0.9→0.6 across all constant-rho tiers.
# noise_heteroscedasticity=0.0: PXR residuals show no significant positive
# heteroscedasticity with activity (Spearman rho≈-0.09 in real runs).

data:
  dataset_path: data/pxr_challenge_train.csv
  dataset_smiles_col: SMILES
  dataset_activity_col: pEC50
  results_path: results/oracle_pxr_rho08
  dataset_split_seed: 43
  gtm_seed: 1234
  setup_results_path: results/pxr_chemprop
  seed_data_path: null
  seed_smiles_col: SMILES
  seed_activity_col: pEC50

active_learning:
  strategies:
    - EI
    - UCB
    - Random
    - Exploitation
    - Exploration
  split_types:
    - random
  seeds: [42, 43, 44, 45, 46]
  k_iter: 32
  query_size: 100
  n_start: 100

training:
  n_models: 5
  max_epochs: 200
  es_min_delta: 0.001
  es_patience: 15
  use_chemeleon: false

clustering:
  method: butina
  k_clusters: 10
  butina_cutoff: 0.65

oracle:
  initial_mae: 0.9
  final_mae: 0.6
  initial_uncertainty_rho: 0.8
  final_uncertainty_rho: 0.8
  initial_shrinkage: 0.45
  final_shrinkage: 0.45
  noise_heteroscedasticity: 0.0
